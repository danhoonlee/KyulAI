<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImperialAX 비밀번호 재설정</title>
    <link rel="alternate" hreflang="en" href="https://ai.imperialax.com/forgot-v2.html" />
    <link rel="stylesheet" href="./login-v2.css?v=20260619-forgot1" />
  </head>
  <body>
    <main class="login-shell">
      <header class="login-topbar" aria-label="비밀번호 재설정 내비게이션">
        <a class="brand-mark" href="https://ai.imperialax.com/login-v2.ko.html" aria-label="로그인으로 돌아가기">
          <span class="brand-wordmark">C2ES</span>
        </a>
        <div class="topbar-actions">
          <a class="language-link" href="https://ai.imperialax.com/forgot-v2.html" hreflang="en">English</a>
          <a class="language-link" href="https://ai.imperialax.com/login-v2.ko.html">로그인</a>
        </div>
      </header>

      <section class="access-layout" aria-labelledby="forgot-title">
        <div class="workspace-panel">
          <div class="workspace-copy">
            <p class="eyebrow">계정 복구</p>
            <h1 id="forgot-title">
              <span>비밀번호</span>
              <span>재설정</span>
            </h1>
            <p>
              회원가입 때 사용한 이름과 이메일로 계정을 확인한 뒤 ImperialAX
              워크스페이스의 새 비밀번호를 설정합니다.
            </p>
          </div>

          <div class="command-board" aria-label="비밀번호 재설정 미리보기">
            <div class="command-head">
              <span>복구 확인</span>
              <strong>이름 + 이메일</strong>
            </div>
            <div class="signal-grid">
              <div><span class="signal-dot"></span>계정 확인</div>
              <div><span class="signal-dot"></span>비밀번호 업데이트</div>
              <div><span class="signal-dot"></span>워크스페이스 로그인</div>
            </div>
            <svg class="forecast-preview" viewBox="0 0 680 260" role="img" aria-label="계정 복구 미리보기">
              <defs>
                <linearGradient id="forgotGlow" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0%" stop-color="#111318" />
                  <stop offset="52%" stop-color="#2167ff" />
                  <stop offset="100%" stop-color="#00a878" />
                </linearGradient>
              </defs>
              <path class="grid-line" d="M44 58H636M44 128H636M44 198H636" />
              <path class="grid-line vertical" d="M138 34V220M274 34V220M410 34V220M546 34V220" />
              <path
                class="curve-line"
                d="M52 188 C118 172 166 135 226 142 C300 151 326 88 394 92 C472 96 512 154 632 72"
                style="stroke: url('#forgotGlow')"
              />
              <circle class="pt-marker" cx="394" cy="92" r="9" />
              <circle class="pt-ring" cx="394" cy="92" r="21" />
            </svg>
          </div>
        </div>

        <form class="login-panel signup-panel" id="forgot-v2-form" novalidate>
          <div class="panel-head">
            <div>
              <p class="eyebrow">비밀번호 찾기</p>
              <h2>비밀번호 재설정</h2>
            </div>
          </div>

          <label class="field">
            <span>이름</span>
            <input id="forgot-name" type="text" autocomplete="name" placeholder="계정 이름" />
          </label>
          <label class="field">
            <span>이메일</span>
            <input id="forgot-email" type="email" autocomplete="email" placeholder="you@company.com" />
          </label>
          <p class="field-note">이 이메일이 로그인 ID입니다.</p>
          <label class="field">
            <span>새 비밀번호</span>
            <input
              id="forgot-password"
              type="password"
              autocomplete="new-password"
              placeholder="8자 이상"
            />
          </label>

          <p class="form-message" id="forgot-message" role="status"></p>

          <div class="button-row">
            <button class="primary-button" type="submit">
              <span class="button-icon" aria-hidden="true">-></span>
              비밀번호 재설정
            </button>
            <a class="secondary-button account-link" href="https://ai.imperialax.com/login-v2.ko.html">로그인으로 돌아가기</a>
          </div>
        </form>
      </section>
    </main>

    <script src="./forgot-v2.js?v=20260619-forgot1" type="module"></script>
  </body>
</html>
