<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luvelox 최적화</title>
    <link rel="alternate" hreflang="en" href="https://ai.luvelox.com/optimization.html" />
    <link rel="stylesheet" href="./styles.css?v=20260619-opt1" />
  </head>
  <body>
    <main class="app-shell optimization-shell">
      <header class="workspace-hero optimization-hero">
        <div class="brand-lockup">
          <p class="eyebrow">Luvelox Optimization</p>
          <h1>
            <span>Laminate</span>
            <span>설계 탐색</span>
          </h1>
          <p class="hero-copy">
            Double-Double laminate 각도 후보를 탐색하고 response surrogate로 유망 설계를 랭킹합니다.
          </p>
        </div>
        <div class="account-cluster">
          <a class="language-link" href="https://ai.luvelox.com/optimization.html">English</a>
          <a class="language-link" href="https://ai.luvelox.com/index.ko.html">모듈 선택</a>
        </div>
      </header>

      <section class="optimization-workspace">
        <form class="optimization-panel" id="optimization-form">
          <div>
            <p class="eyebrow">탐색 설정</p>
            <h2>설계 공간</h2>
          </div>

          <div class="form-grid">
            <label>
              목표
              <select id="objective-input">
                <option value="balanced">균형 점수</option>
                <option value="maximize_pt">Pt 최대화</option>
                <option value="maximize_force">Force 최대화</option>
                <option value="minimize_displacement">변위 최소화</option>
                <option value="target_pt">목표 Pt 근접</option>
              </select>
            </label>
            <label>
              목표 Pt
              <input id="target-pt-input" type="number" inputmode="decimal" placeholder="선택" />
            </label>
            <label>
              후보 수
              <input id="top-k-input" type="number" min="1" max="25" value="5" />
            </label>
            <label>
              각도 간격
              <input id="step-input" type="number" min="1" max="90" value="30" />
            </label>
          </div>

          <div class="case-picker" aria-label="Cases">
            <label><input type="checkbox" name="case" value="Case2" checked /> Case2</label>
            <label><input type="checkbox" name="case" value="Case3" /> Case3</label>
            <label><input type="checkbox" name="case" value="Case4" /> Case4</label>
          </div>

          <div class="form-grid">
            <label>
              Theta 1 최소
              <input id="theta1-min-input" type="number" min="-90" max="90" value="-30" />
            </label>
            <label>
              Theta 1 최대
              <input id="theta1-max-input" type="number" min="-90" max="90" value="30" />
            </label>
            <label>
              Theta 2 최소
              <input id="theta2-min-input" type="number" min="-90" max="90" value="-30" />
            </label>
            <label>
              Theta 2 최대
              <input id="theta2-max-input" type="number" min="-90" max="90" value="30" />
            </label>
          </div>

          <div class="form-grid">
            <label>
              목표 Type
              <select id="target-type-input">
                <option value="">무관</option>
                <option value="1">Type 1</option>
                <option value="2">Type 2</option>
                <option value="3">Type 3</option>
                <option value="4">Type 4</option>
              </select>
            </label>
            <label>
              최소 confidence
              <input id="min-confidence-input" type="number" min="0" max="1" step="0.01" placeholder="선택" />
            </label>
            <label>
              최소 force
              <input id="min-force-input" type="number" inputmode="decimal" placeholder="선택" />
            </label>
            <label>
              최대 displacement
              <input id="max-displacement-input" type="number" inputmode="decimal" placeholder="선택" />
            </label>
          </div>

          <button id="search-button" type="submit">후보 탐색</button>
          <p class="request-status" id="optimization-status" role="status"></p>
        </form>

        <section class="optimization-results" aria-live="polite">
          <div class="admin-table-head">
            <div>
              <p class="eyebrow">랭킹 결과</p>
              <h2>상위 후보</h2>
            </div>
            <strong id="search-summary">준비됨</strong>
          </div>
          <div class="candidate-list" id="candidate-list"></div>
        </section>
      </section>
    </main>

    <script src="./optimization.js?v=20260619-opt1" type="module"></script>
  </body>
</html>
