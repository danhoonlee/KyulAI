  <rect class="bg" width="720" height="470" rx="32"/>
  <path class="soft" d="M504 36c84 22 141 86 141 160 0 113-113 205-253 205-82 0-153-26-197-67 55 21 137 16 209-19 100-48 154-139 121-203-8-17-21-30-39-42 6-13 12-24 18-34z" opacity=".55"/>
  <path class="road" d="M76 360 C182 310 248 240 318 183 C382 130 457 104 625 84"/>
  <path class="road2" d="M124 130 C224 160 320 190 430 205 C518 217 584 212 650 188"/>
  <path class="road2" d="M266 420 C310 336 352 250 391 118"/>
  <path class="path" d="M214 342 C270 318 318 286 363 243"/>
  <path class="shuttle" d="M214 342 C286 294 358 246 473 184"/>
  <g transform="translate(164 310)">
