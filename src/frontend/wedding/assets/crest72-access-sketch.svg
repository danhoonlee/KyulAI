<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">크레스트72 약도</title>
  <desc id="desc">동대입구역 6번 출구, 국립극장, 반얀트리 호텔, 크레스트72 글라스홀 위치를 단순화한 약도</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}
      .paper{fill:#f4efe7}
      .road{fill:none;stroke:#1f1f1c;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
      .road2{fill:none;stroke:#1f1f1c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.34}
      .path{fill:none;stroke:#6f675b;stroke-width:5;stroke-dasharray:9 10;stroke-linecap:round}
      .shuttle{fill:none;stroke:#1f1f1c;stroke-width:5;stroke-dasharray:14 9;stroke-linecap:round}
      .label{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:22px;font-weight:700;fill:#1f1f1c}
      .small{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;font-weight:600;fill:#6f675b}
      .tiny{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;font-weight:600;fill:#777168}
      .pin{fill:#161614}
      .pinText{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:700;fill:#fffdf8}
      .station{fill:#fffdf8;stroke:#161614;stroke-width:4}
      .landmark{fill:#fffdf8;stroke:#1f1f1c;stroke-width:3}
      .soft{fill:#ebe4da}
    </style>
