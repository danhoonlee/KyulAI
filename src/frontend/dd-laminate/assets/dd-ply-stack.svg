<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Double-Double laminate ply stack reference</title>
  <desc id="desc">A stylized ply stack diagram inspired by an Abaqus ply stack plot, showing sixteen alternating laminate plies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1c334e"/>
      <stop offset="0.58" stop-color="#2f4966"/>
      <stop offset="1" stop-color="#7b8da1"/>
    </linearGradient>
    <linearGradient id="topBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#8fa2e8"/>
      <stop offset="1" stop-color="#6479c8"/>
    </linearGradient>
    <linearGradient id="topTan" x1="0" x2="1">
      <stop offset="0" stop-color="#d7b79d"/>
      <stop offset="1" stop-color="#b8957b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dac0aa"/>
      <stop offset="1" stop-color="#b4957c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#081426" flood-opacity="0.28"/>
    </filter>
    <pattern id="angleA" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="skewX(-22)">
      <path d="M0 18 L18 0" stroke="#ff5d7b" stroke-width="2"/>
    </pattern>
    <pattern id="angleB" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="skewX(22)">
      <path d="M0 0 L18 18" stroke="#ff815f" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="760" height="560" fill="url(#bg)"/>
  <g opacity="0.28" stroke="#eaf4ff" stroke-width="1">
    <path d="M62 410 L660 80"/>
    <path d="M88 438 L686 108"/>
    <path d="M112 466 L710 136"/>
  </g>

  <g transform="translate(102 132)" filter="url(#shadow)">
    <g id="base">
      <polygon points="0,214 418,446 624,328 206,96" fill="#b7957e"/>
      <polygon points="0,214 418,446 418,482 0,250" fill="#caa98f"/>
      <polygon points="418,446 624,328 624,364 418,482" fill="#a88770"/>
      <g opacity="0.8">
        <polygon points="6,222 414,448 414,456 6,230" fill="#7d91d7"/>
        <polygon points="6,236 414,462 414,470 6,244" fill="#d5b79f"/>
        <polygon points="6,250 414,476 414,484 6,258" fill="#7d91d7"/>
      </g>
    </g>

    <g id="plies">
      <g transform="translate(22 0)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topTan)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#c6a48b"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#a4836d"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleB)" opacity="0.9"/>
      </g>
      <g transform="translate(58 -32)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topBlue)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#8394d6"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#6473b8"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleA)" opacity="0.9"/>
      </g>
      <g transform="translate(96 -64)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topTan)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#c6a48b"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#a4836d"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleB)" opacity="0.9"/>
      </g>
      <g transform="translate(132 -96)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topBlue)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#8394d6"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#6473b8"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleA)" opacity="0.9"/>
      </g>
      <g transform="translate(170 -128)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topTan)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#c6a48b"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#a4836d"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleB)" opacity="0.9"/>
      </g>
      <g transform="translate(206 -160)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topBlue)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#8394d6"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#6473b8"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleA)" opacity="0.9"/>
      </g>
      <g transform="translate(244 -192)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topTan)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#c6a48b"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#a4836d"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleB)" opacity="0.9"/>
      </g>
      <g transform="translate(280 -224)">
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#topBlue)"/>
        <polygon points="0,210 118,276 118,306 0,240" fill="#8394d6"/>
        <polygon points="118,276 318,162 318,192 118,306" fill="#6473b8"/>
        <polygon points="0,210 118,276 318,162 200,96" fill="url(#angleA)" opacity="0.9"/>
      </g>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ff00">
      <text x="522" y="87">Ply-16</text>
      <text x="488" y="118">Ply-15</text>
      <text x="450" y="149">Ply-14</text>
      <text x="415" y="181">Ply-13</text>
      <text x="376" y="214">Ply-12</text>
      <text x="340" y="246">Ply-11</text>
      <text x="300" y="278">Ply-10</text>
      <text x="264" y="311">Ply-9</text>
      <text x="226" y="344">Ply-8</text>
      <text x="190" y="377">Ply-7</text>
    </g>
  </g>

  <g transform="translate(78 455)" font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="0" y="0" fill="#ffffff" font-weight="700">DD laminate ply stack reference</text>
    <text x="0" y="20" fill="#dbeafe">Alternating ±θ plies, 16-ply visualization</text>
  </g>
</svg>
