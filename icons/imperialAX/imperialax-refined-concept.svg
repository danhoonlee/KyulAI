    <rect x="183" y="112" width="82" height="25" rx="3" fill="#0a2e70"/>
    <polygon points="404,0 458,0 533,77 505,107" fill="url(#navy)"/>
    <polygon points="402,178 505,71 534,101 456,178" fill="url(#navy)"/>
    <polygon points="559,2 610,2 548,66 510,66" fill="url(#axBlue)"/>
    <polygon points="510,112 548,112 610,176 559,176" fill="url(#axBlue)"/>
  </g>

