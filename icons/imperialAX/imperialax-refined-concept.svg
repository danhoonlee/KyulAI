<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="axBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17c9ef"/>
      <stop offset="0.55" stop-color="#1467ff"/>
      <stop offset="1" stop-color="#003fb7"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b45"/>
      <stop offset="1" stop-color="#0d3b8e"/>
    </linearGradient>
    <style>
      .label { font-family: Inter, Avenir Next, Arial, sans-serif; fill: #7a8495; font-size: 22px; font-weight: 700; letter-spacing: 4px; }
      .word { font-family: Avenir Next, Inter, Arial, sans-serif; font-size: 88px; font-weight: 500; letter-spacing: 1px; }
      .tag { font-family: Inter, Avenir Next, Arial, sans-serif; fill: #0a1740; font-size: 23px; font-weight: 700; letter-spacing: 13px; }
      .smallWord { font-family: Avenir Next, Inter, Arial, sans-serif; font-size: 54px; font-weight: 500; letter-spacing: 0; }
      .smallTag { font-family: Inter, Avenir Next, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 5px; }
      .darkWord { font-family: Avenir Next, Inter, Arial, sans-serif; font-size: 54px; font-weight: 500; letter-spacing: 0; }
      .darkTag { font-family: Inter, Avenir Next, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 5px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
