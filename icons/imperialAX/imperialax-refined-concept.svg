  <line x1="64" y1="92" x2="1536" y2="92" stroke="#ccd3dd" stroke-width="2"/>

  <!-- Primary mark: wider spacing, a clearer A crossbar, and a separated X accent. -->
  <g transform="translate(446 154) scale(1.18)">
